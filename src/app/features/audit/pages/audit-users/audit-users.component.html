<app-canvas [showSidebar]="true" [sidebarItems]="sidebarItems" [noCard]="true"
    pageTitle="Gestión de usuarios" pageSubtitle="Administre los usuarios del sistema">

    <div class="page-actions" pageActions *ngIf="!showCreateForm">
        <button matButton="filled" color="secondary" class="create-btn" (click)="showCreateUserForm()">
            <mat-icon>person_add</mat-icon> Crear usuario
        </button>
    </div>

    <ng-container *ngIf="!showCreateForm">
        <ui-drawer [open]="drawerOpen" title="Editar usuario" (closed)="closeDrawer()">
            <app-audit-user-detail-panel drawerContent
                [user]="selectedUser"
                [roles]="availableRoleOptions"
                [saving]="saving"
                (save)="onSaveUser($event)"
                (formStateChange)="onFormState($event)">
            </app-audit-user-detail-panel>

            <div class="drawer-actions" drawerFooter>
                <button matButton="filled" color="secondary" class="block"
                    [disabled]="!canSave || saving" (click)="detailPanel?.submit()">
                    <mat-spinner *ngIf="saving" diameter="18"></mat-spinner>
                    <mat-icon *ngIf="!saving">save</mat-icon>
                    Guardar
                </button>
                <button matButton="outlined" class="mat-error block"
                    [disabled]="saving || !selectedUser" (click)="onDeleteUser(selectedUser)">
                    <mat-icon>delete</mat-icon> Eliminar
                </button>
            </div>

            <ui-results-toolbar [control]="searchControl"
                placeholder="Buscar por nombre, usuario, email o CUIL"
                [isLoading]="loadingUsers" [showRefresh]="false">
            </ui-results-toolbar>

            <ui-results-list [loading]="loadingUsers" [total]="totalUsers" label="Usuarios"
                emptyIcon="people" emptyMessage="No se encontraron usuarios"
                [pageSize]="usersPageSize" [pageIndex]="usersPageIndex" [pageSizeOptions]="[10, 20, 30]"
                (page)="onPageChange($event)">
                <app-audit-user-item *ngFor="let user of users" [user]="user"
                    [selected]="isSelected(user)" (select)="openDrawer($event)" (remove)="onDeleteUser($event)">
                </app-audit-user-item>
            </ui-results-list>
        </ui-drawer>
    </ng-container>

    <div *ngIf="showCreateForm">
        <app-user-create (cancelCreate)="onCancelCreateUser()" (userCreated)="onUserCreated()">
        </app-user-create>
    </div>
</app-canvas>
