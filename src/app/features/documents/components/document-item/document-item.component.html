<ui-list-item
    *ngIf="document"
    class="document-item"
    [selected]="selected"
    (select)="onSelect()">

    <div itemContent>
        <div class="chip-row">
            <div class="rx-head" *ngIf="date">
                <mat-icon class="sm text-secondary">event</mat-icon>
                <strong class="text-sm">{{ date | date: "d MMM yyyy" }}</strong>
            </div>
            <ui-badge-chip [variant]="statusVariant">{{ statusLabel }}</ui-badge-chip>
        </div>

        <div class="di-row-two">
            <ui-entity *ngIf="hasPatient" icon="person" [container]="false">
                <span entityName class="text-subtitle truncate">{{ patientFullName | titlecase }}</span>
                <small entityMeta class="text-xs text-secondary" *ngIf="patientDni">DNI {{ patientDni }}</small>
            </ui-entity>

            <div class="rx-head">
                <mat-icon class="sm text-secondary">{{ icon }}</mat-icon>
                <div class="rx-title">
                    <h3 class="text-subtitle truncate">{{ title | titlecase }}</h3>
                    <div class="rx-subline" *ngIf="medicineType || medicationDetail || subtitle">
                        <strong *ngIf="medicineType" class="med-type {{ medicineType }}">
                            {{ medicineType | titlecase }}
                        </strong>
                        <small class="text-xs text-secondary truncate" *ngIf="medicationDetail">
                            {{ medicationDetail | capitalize }}
                        </small>
                        <small class="text-xs text-secondary truncate" *ngIf="!medicationDetail && subtitle">
                            {{ subtitle | titlecase }}
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div itemActions>
        <button matButton="tonal" class="block" *ngIf="canPrint" (click)="onPrint()">
            <mat-icon>print</mat-icon> Imprimir
        </button>
        <button matButton="outlined" class="mat-error block" *ngIf="canAnulate" (click)="onAnulate()">
            <mat-icon>block</mat-icon> Anular
        </button>
        <button matButton="outlined" class="mat-error block" *ngIf="canRemove" (click)="onRemove()">
            <mat-icon>delete</mat-icon> Eliminar
        </button>
    </div>
</ui-list-item>
