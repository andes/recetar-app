<app-canvas [showSidebar]="true" [sidebarItems]="sidebarItems" [noCard]="true" pageTitle="Gestión de Documentos"
    pageSubtitle="Busque, filtre y gestione recetas, certificados, prácticas e insumos">

    <ui-drawer [open]="drawerOpen" [title]="drawerTitle" (closed)="closeDrawer()">
        <app-document-detail-panel drawerContent [type]="selectedType || 'receta'" [document]="selectedDocument">
        </app-document-detail-panel>

        <div class="drawer-actions" drawerFooter *ngIf="selectedDocument">
            <button matButton="tonal" class="block" *ngIf="canPrintSelected()" (click)="printSelected()">
                <mat-icon>print</mat-icon> Imprimir
            </button>
            <button matButton="outlined" class="mat-error block" *ngIf="canAnulateSelected()"
                (click)="anulateSelected()">
                <mat-icon>block</mat-icon> Anular
            </button>
            <button matButton="outlined" class="mat-error block" *ngIf="canDeleteSelected()" (click)="deleteSelected()">
                <mat-icon>delete</mat-icon> Eliminar
            </button>
        </div>

        <div class="dispense-layout">
            <div class="dispense-main">

                <!-- TYPE TOGGLE -->
                <div class="type-toggle-section">
                    <ui-toggle [options]="typeOptions" [value]="selectedType" (valueChange)="onTypeChange($event)"
                        variant="big">
                    </ui-toggle>
                </div>

                <ui-empty-state *ngIf="!selectedType" icon="description">
                    Seleccione un tipo de documento para visualizar
                </ui-empty-state>

                <ng-container *ngIf="selectedType">
                    <ui-results-toolbar [control]="searchControl"
                        placeholder="Buscar por paciente, DNI, medicamento o código..."
                        [isLoading]="isLoading()" [showFilters]="true" [showRefresh]="true"
                        [filterCount]="activeFilterCount" [hasActiveFilters]="hasActiveFilters"
                        (refresh)="refresh()" (clearSearch)="clearSearch()" (clearFilters)="clearFilters()">
                        <div class="filter-group" filters>
                            <label>Fecha desde</label>
                            <ui-date-field [control]="filterDateFrom" placeholder="DD/MM/AAAA"></ui-date-field>
                        </div>
                        <div class="filter-group" filters>
                            <label>Fecha hasta</label>
                            <ui-date-field [control]="filterDateTo" placeholder="DD/MM/AAAA"></ui-date-field>
                        </div>
                        <div class="filter-group" filters>
                            <label>Estado</label>
                            <ui-field-input type="select" [control]="filterStatus">
                                <option value="">Todos</option>
                                <option value="pendiente">Pendiente</option>
                                <option value="dispensada">Dispensada</option>
                                <option value="activa">Activa</option>
                                <option value="vencida">Vencida</option>
                                <option value="anulada">Anulada</option>
                            </ui-field-input>
                        </div>
                    </ui-results-toolbar>

                    <ui-results-list [loading]="isLoading()" [total]="totalResults" [label]="resultsLabel"
                        emptyIcon="description" [emptyMessage]="'No se encontraron ' + (resultsLabel | lowercase)"
                        [pageSize]="pageSize" [pageIndex]="pageIndex" [pageSizeOptions]="[5, 15, 30]"
                        (page)="onPageChange($event)">
                        <app-document-item *ngFor="let item of currentItems" [type]="selectedType" [document]="item"
                            [selected]="isSelected(item)" (select)="selectDocument($event)"
                            (print)="printDocument($event)" (remove)="removeDocument($event)"
                            (anulate)="anulateDocument($event)">
                        </app-document-item>
                    </ui-results-list>
                </ng-container>
            </div>
        </div>
    </ui-drawer>

</app-canvas>
