<ui-list-item
    *ngIf="prescription"
    class="dispense-item"
    [selected]="selected"
    [class.dispensed]="isDispensed"
    [class.expired]="isExpired"
    (select)="onSelect()"
>
    <div itemContent>
        <div class="chip-row">
            <div class="rx-head">
                <mat-icon class="sm text-secondary">event</mat-icon>
                <strong class="text-sm">{{
                    creationDate | date: "d MMM yyyy"
                }}</strong>
            </div>
            <ui-badge-chip [status]="status"></ui-badge-chip>
            <ui-badge-chip [variant]="daysToExpire < 5 ? 'error' : 'warning'"
                *ngIf="isPending && daysToExpire !== null && daysToExpire < 10">
                Vence en {{ daysToExpire }}
                {{ daysToExpire === 1 ? "día" : "días" }}
            </ui-badge-chip>
            <ui-undo-countdown
                *ngIf="canCancelDispense"
                [dispensedAt]="dispensedAt"
            ></ui-undo-countdown>
        </div>

        <div class="rx-head">
            <mat-icon class="sm text-secondary">pill</mat-icon>
            <div class="rx-title">
                <h3 class="text-subtitle">{{ medicineName | titlecase }}</h3>
                <strong *ngIf="medicineType" class="med-type {{ medicineType }}">
                    {{ medicineType | titlecase }}
                </strong>
            </div>
        </div>

        <ui-entity icon="person" [container]="false">
            <span entityName class="truncate">{{ patientFullName | titlecase }}</span>
            <small entityMeta class="text-xs text-secondary" *ngIf="patientDni">DNI {{ patientDni }}</small>
            <small entityMeta class="text-xs text-secondary" *ngIf="!patientDni">Sin DNI</small>
        </ui-entity>
    </div>

    <div itemActions>
        <button matButton="tonal" class="block" (click)="onPrint()">
            <mat-icon>print</mat-icon> Imprimir
        </button>
        <button
            [matButton]="isPending ? 'filled' : 'outlined'"
            color="secondary"
            class="block"
            [disabled]="!isPending"
            (click)="onDispense()"
            *ngIf="!isDispensed"
        >
            <mat-icon>done_all</mat-icon> Dispensar
        </button>
        <span
            *ngIf="isDispensed"
            class="undo-btn-wrap"
            [matTooltip]="
                undoDisabled ? 'Ya no se puede deshacer la dispensa' : ''
            "
            matTooltipPosition="above"
        >
            <button
                matButton="outlined"
                class="mat-warn block"
                [disabled]="undoDisabled"
                (click)="onCancelDispense()"
            >
                <mat-icon>undo</mat-icon> Deshacer
            </button>
        </span>
    </div>
</ui-list-item>
