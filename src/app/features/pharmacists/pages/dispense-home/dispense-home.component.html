<app-canvas [showSidebar]="true" [sidebarItems]="sidebarItems" [noCard]="true" pageTitle="Dispensar"
    pageSubtitle="Busque y dispense recetas pendientes">

    <ui-drawer [open]="drawerOpen" title="Detalle de receta" (closed)="closeDrawer()">
        <app-dispense-preview-panel drawerContent [prescription]="selectedPrescription">
        </app-dispense-preview-panel>

        <div class="drawer-actions" drawerFooter *ngIf="selectedPrescription">
            <button matButton="tonal" class="block" (click)="onPrint(selectedPrescription)">
                <mat-icon>print</mat-icon> Imprimir
            </button>
            <button [matButton]="isPendingSelected() ? 'filled' : 'outlined'" color="secondary" class="block"
                [disabled]="!isPendingSelected()" (click)="onDispense(selectedPrescription)" *ngIf="!isDispensedSelected()">
                <mat-icon>done_all</mat-icon> Dispensar
            </button>
            <span *ngIf="isDispensedSelected()" class="undo-btn-wrap"
                [matTooltip]="undoDisabledSelected ? 'Ya no se puede deshacer la dispensa' : ''"
                matTooltipPosition="above">
                <button matButton="outlined" color="warn" class="block" [disabled]="undoDisabledSelected"
                    (click)="onCancelDispense(selectedPrescription)">
                    <mat-icon>undo</mat-icon> Deshacer
                </button>
            </span>
        </div>

        <div class="dispense-layout">
            <div class="dispense-main">

            <div class="search-card-wrap">
                <ui-card stretch>
                    <div class="results-toolbar">
                        <div class="search-bar-wrap">
                            <ui-search-bar [control]="searchControl"
                                placeholder="Buscar por DNI, nombre del paciente o código de receta..." [stretch]="true"
                                (keydown.enter)="onSearch()">
                                <button matButton="tonal" class="btn-icon" searchAction *ngIf="searchControl.value"
                                    matTooltip="Borrar búsqueda" (click)="onClearSearch()">
                                    <mat-icon>close</mat-icon>
                                </button>
                            </ui-search-bar>
                        </div>
                        <button matButton="tonal" class="filter-toggle-btn" [class.has-filters]="hasActiveFilters"
                            (click)="showFilters = !showFilters">
                            <mat-icon>{{ !showFilters ? 'arrow_drop_down' : 'arrow_drop_up' }}</mat-icon>
                            Filtros{{ activeFilterCount > 0 ? ' (' + activeFilterCount + ')' : '' }}
                        </button>
                        <button matButton="outlined" (click)="onRefresh()" matTooltip="Actualizar datos">
                            <mat-icon>refresh</mat-icon>
                            Actualizar
                        </button>
                    </div>

                    <div class="filter-panel" [hidden]="!showFilters">
                        <div class="filter-fields">
                            <div class="filter-group">
                                <label>Fecha desde</label>
                                <ui-date-field [control]="dateFromControl" placeholder="DD/MM/AAAA"></ui-date-field>
                            </div>
                            <div class="filter-group">
                                <label>Fecha hasta</label>
                                <ui-date-field [control]="dateToControl" placeholder="DD/MM/AAAA"></ui-date-field>
                            </div>
                            <div class="filter-group">
                                <label>Estado</label>
                                <select class="filter-input filter-select" [formControl]="statusControl">
                                    <option *ngFor="let opt of statusOptions" [value]="opt.value">{{ opt.label }}
                                    </option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>Sexo</label>
                                <select class="filter-input filter-select" [formControl]="sexoControl">
                                    <option *ngFor="let opt of sexoOptions" [value]="opt.value">{{ opt.label }}
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="filter-actions">
                            <button matButton="tonal" (click)="onClear()">
                                <mat-icon>clear_all</mat-icon> Limpiar
                            </button>
                        </div>
                    </div>
                </ui-card>
            </div>

            <div class="table-card-wrap">
                <div class="results-count" *ngIf="(total$ | async) !== null && !(loading$ | async)">
                    <span class="results-count-type">Recetas</span>
                    <small class="results-count-range">
                        Mostrando {{ resultsFrom }}&ndash;{{ resultsTo }} de {{ total$ | async }} resultados
                    </small>
                </div>

                <div *ngIf="loading$ | async" class="loading-container">
                    <mat-spinner diameter="40"></mat-spinner>
                </div>

                <div *ngIf="!(loading$ | async) && (prescriptions$ | async)?.length === 0" class="empty-container">
                    <ui-empty-state icon="medication">No se encontraron recetas</ui-empty-state>
                </div>

                <div class="dispense-items" *ngIf="!(loading$ | async) && (prescriptions$ | async)?.length > 0">
                    <app-dispense-item *ngFor="let p of prescriptions$ | async" [prescription]="p"
                        [selected]="isSelected(p)" (select)="selectPrescription($event)" (print)="onPrint($event)"
                        (dispense)="onDispense($event)" (cancelDispense)="onCancelDispense($event)">
                    </app-dispense-item>
                </div>

                <ui-paginator [length]="(total$ | async) || 0" [pageSize]="pageSize" [pageIndex]="pageIndex"
                    [pageSizeOptions]="[5, 15, 30]" (page)="onPageChange($event)">
                </ui-paginator>
            </div>
        </div>
    </div>
</ui-drawer>

</app-canvas>
