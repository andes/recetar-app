<div class="panel-head">
    <h3>Contraseña</h3>
    <p>Cambiá tu contraseña de acceso a la plataforma.</p>
</div>

<form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" autocomplete="off" novalidate>
    <div class="form-fields">
        <app-form-field [type]="hideCurrent ? 'password' : 'text'" label="Contraseña actual"
            [control]="oldPassword" placeholder="Tu contraseña actual"
            [suffixIcon]="hideCurrent ? 'visibility_off' : 'visibility'"
            [errors]="{ 'required': 'La contraseña actual es obligatoria' }"
            [submitted]="submitted" [fullwidth]="true" (suffixClick)="hideCurrent = !hideCurrent">
        </app-form-field>

        <app-form-field [type]="hideNew ? 'password' : 'text'" label="Nueva contraseña"
            [control]="newPassword" placeholder="Tu nueva contraseña"
            [suffixIcon]="hideNew ? 'visibility_off' : 'visibility'"
            [errors]="{ 'required': 'La contraseña nueva es obligatoria', 'minlength': 'Debe tener al menos 8 caracteres' }"
            [submitted]="submitted" [fullwidth]="true" (suffixClick)="hideNew = !hideNew">
        </app-form-field>

        <app-form-field [type]="hideConfirm ? 'password' : 'text'" label="Confirmar contraseña"
            [control]="confirmPassword" placeholder="Repetí la nueva contraseña"
            [suffixIcon]="hideConfirm ? 'visibility_off' : 'visibility'"
            [errors]="{ 'required': 'La confirmación es obligatoria', 'passwordMismatch': 'Las contraseñas no coinciden' }"
            [submitted]="submitted" [fullwidth]="true" (suffixClick)="hideConfirm = !hideConfirm">
        </app-form-field>
    </div>

    <div class="form-actions">
        <button type="button" matButton="tonal" (click)="cancel()" [disabled]="isSaving || !passwordForm.dirty">
            Cancelar
        </button>
        <button type="submit" matButton="filled" [disabled]="isSaving || !passwordForm.dirty">
            @if (isSaving) {
                <mat-spinner diameter="20"></mat-spinner>
                <span>Cambiando...</span>
            } @else {
                Cambiar contraseña
            }
        </button>
    </div>
</form>
