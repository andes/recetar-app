<div class="auth-shell">
    <ui-card class="auth-card">
        <div class="form-head">
            <h2><mat-icon class="sm">lock</mat-icon> Cambiando contraseña</h2>
        </div>

        <form [formGroup]="resetForm" #resetNgForm="ngForm" (ngSubmit)="onSubmitEvent(resetForm, resetNgForm)">
            <app-form-field type="password" label="Contraseña actual" [control]="oldPassword"
                placeholder="Tu contraseña actual"
                [suffixIcon]="hideOldPassword ? 'visibility_off' : 'visibility'"
                (suffixClick)="hideOldPassword = !hideOldPassword"
                [errors]="{ required: 'Contraseña actual es requerida' }">
            </app-form-field>

            <app-form-field type="password" label="Nueva contraseña" [control]="newPassword"
                placeholder="Tu nueva contraseña"
                [suffixIcon]="hideNewPassword ? 'visibility_off' : 'visibility'"
                (suffixClick)="hideNewPassword = !hideNewPassword"
                [errors]="{ required: 'Contraseña nueva es requerida', minlength: 'Debe tener al menos 8 caracteres' }">
            </app-form-field>

            <div class="form-actions">
                <button type="button" matButton="outlined" (click)="backClicked()" [disabled]="showSubmit">
                    Volver
                </button>
                <button type="submit" matButton="filled" [disabled]="showSubmit">
                    @if (showSubmit) {
                        <mat-spinner diameter="20"></mat-spinner>
                    } @else {
                        Cambiar contraseña
                    }
                </button>
            </div>
        </form>
    </ui-card>
</div>
