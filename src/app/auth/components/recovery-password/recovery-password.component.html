<div class="auth-shell">
    <ui-card class="auth-card">
        <div class="form-head">
            <h2><mat-icon class="sm">lock</mat-icon> Reestablecer contraseña</h2>
        </div>

        @if (error) {
            <ui-alert variant="error" [fullwidth]="true">{{ error }}</ui-alert>
        }

        <form [formGroup]="recoveryForm" #recoveryNgForm="ngForm"
            (ngSubmit)="onSubmitEvent(recoveryForm, recoveryNgForm)">
            <app-form-field type="password" label="Nueva contraseña" [control]="newPassword"
                placeholder="Tu nueva contraseña"
                [suffixIcon]="hideNewPassword ? 'visibility_off' : 'visibility'"
                (suffixClick)="hideNewPassword = !hideNewPassword"
                [errors]="{ required: 'Contraseña nueva es requerida', minlength: 'Debe tener al menos 8 caracteres' }">
            </app-form-field>

            <app-form-field type="password" label="Confirmar contraseña" [control]="confirmPassword"
                placeholder="Repetí la nueva contraseña"
                [suffixIcon]="hideNewPassword ? 'visibility_off' : 'visibility'"
                (suffixClick)="hideNewPassword = !hideNewPassword"
                [errors]="{ required: 'La confirmación es requerida' }">
            </app-form-field>

            @if (recoveryForm.hasError('notSame') && confirmPassword.touched) {
                <ui-alert variant="error" [fullwidth]="true">Las contraseñas no coinciden</ui-alert>
            }

            <div class="form-actions">
                <button type="button" matButton="outlined" (click)="backClicked()" [disabled]="showSubmit">
                    Volver
                </button>
                <button type="submit" matButton="filled" [disabled]="showSubmit">
                    @if (showSubmit) {
                        <mat-spinner diameter="20"></mat-spinner>
                    } @else {
                        Cambiar contraseña
                    }
                </button>
            </div>
        </form>
    </ui-card>
</div>
