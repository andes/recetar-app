<div class="auth-shell">
    <div class="logo">
        <img src="assets/img/LogoRecetar.png" class="icon-login">
        <h1 class="title-login">RecetAR</h1>
    </div>

    <ui-card class="auth-card">
        <div class="form-head text-center">
            <h2>Restablecer contraseña</h2>
        </div>

        @if (mailEnviado) {
            <ui-alert variant="success" [fullwidth]="true">
                Hemos enviado un e-mail para regenerar su contraseña.
            </ui-alert>
        } @else {
            <p class="text-sm text-secondary">
                Por favor, ingrese su usuario. Recibirá un correo electrónico con instrucciones para restablecer su contraseña.
            </p>

            <form [formGroup]="forgotForm" #forgotNgForm="ngForm"
                (ngSubmit)="onSubmitEvent(forgotForm, forgotNgForm)">
                <app-form-field type="text" label="Usuario" [control]="usuario"
                    placeholder="Ingrese su Usuario"
                    [errors]="{ required: 'Usuario es requerido' }">
                </app-form-field>

                @if (error) {
                    <ui-alert variant="error" [fullwidth]="true">{{ error }}</ui-alert>
                }

                <div class="form-actions">
                    <button type="button" matButton="outlined" (click)="cancelar()" [disabled]="showSubmit">
                        Cancelar
                    </button>
                    <button type="submit" matButton="filled" [disabled]="showSubmit">
                        @if (showSubmit) {
                            <mat-spinner diameter="20"></mat-spinner>
                        } @else {
                            Recuperar contraseña
                        }
                    </button>
                </div>
            </form>
        }
    </ui-card>
</div>
