<mat-toolbar *ngIf="isLoggedIn$ | async" class="header-toolbar">
  <div class="header-container">
    <div class="header-left-section">
      <div class="menu-area">
        <button matButton="tonal" class="btn-icon menu-button" (click)="menuClick.emit()">
            <ui-icon icon="menu" size="md" [transparent]="true"></ui-icon>
        </button>
      </div>
      <div class="brand">
        <img [src]="logoPath$ | async" alt="RecetAR" class="brand-logo">
      </div>
    </div>

    <div class="header-right-section">
      <div class="user-menu-wrapper" [class.open]="menuOpen">
        <ui-user-menu [open]="menuOpen" (openChange)="menuOpen = $event">
          <button type="button" class="user-trigger" menuTrigger>
            <span class="user-avatar">{{ userInitials }}</span>
            <span class="user-info">
              <span class="user-info-name">{{ businessName$ | async | titlecase }}</span>
              <span *ngIf="roleLabel" class="user-info-role">{{ roleLabel }}</span>
            </span>
            <span class="user-chevron">
              <svg viewBox="0 0 24 24" width="16" height="16">
                <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
              </svg>
            </span>
          </button>

          <div menuHeader class="menu-header">
            <ui-avatar size="md" variant="primary">
              <ui-icon [icon]="roleIcon" [container]="false"></ui-icon>
            </ui-avatar>
            <div class="menu-header-info">
              <strong class="menu-user-name text-base">{{ businessName$ | async | titlecase }}</strong>
              <span class="text-xs text-secondary">{{ userEmail }}</span>
            </div>
          </div>

          <div menuItems>
            <button type="button" class="menu-item" [routerLink]="['/perfil']" (click)="menuOpen = false">
              <ui-icon icon="manage_accounts" [container]="false"></ui-icon>
              <span>Mi cuenta</span>
            </button>
            <button type="button" class="menu-item danger-item" (click)="logout()">
              <ui-icon icon="exit_to_app" [container]="false"></ui-icon>
              <span>Salir</span>
            </button>
          </div>
        </ui-user-menu>
      </div>
    </div>
  </div>
</mat-toolbar>
